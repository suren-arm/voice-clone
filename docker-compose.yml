# =============================================================================
# CPU development stack:  docker compose up --build
# GPU stack:              docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Frontend -> http://localhost:3000
# API docs -> http://localhost:8000/docs
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: cpu
    image: voice-studio-api:cpu
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DIR: /app/storage
      DATABASE_URL: sqlite:////app/storage/voice_studio.db
      VOICE_ENGINE: ${VOICE_ENGINE:-chatterbox}
      # Turbo is the sensible CPU default: 350M parameters, the smallest
      # variant chatterbox-tts actually provides (see
      # ai/chatterbox_engine.py -- a "Nano" checkpoint is not reachable
      # through this package's public API). The 0.5B multilingual model on
      # CPU is minutes per utterance.
      CHATTERBOX_VARIANT: ${CHATTERBOX_VARIANT:-turbo}
      DEVICE: cpu
      PRELOAD_MODEL: ${PRELOAD_MODEL:-false}
      HF_HOME: /cache/huggingface
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-2000}
      ENABLE_EXPERIMENTAL_ARMENIAN: ${ENABLE_EXPERIMENTAL_ARMENIAN:-true}
      # Fairy-tale generation (see README.md's "AI Providers" section): none
      # of these is required, "Create Fairy Tale" works with any subset
      # configured. Compose only forwards variables listed here -- an unset
      # host variable becomes an empty string in the container, which
      # Settings treats the same as "not configured".
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      AI_PREFERRED_PROVIDER: ${AI_PREFERRED_PROVIDER:-}
      AI_AUTO_PREFER_FREE: ${AI_AUTO_PREFER_FREE:-false}
    volumes:
      # Persist user data and downloaded weights across rebuilds.
      - ./storage:/app/storage
      - hf-cache:/cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: voice-studio-web:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf-cache:
