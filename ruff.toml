# Repository-wide lint/format config: covers backend/, ai/ and scripts/ alike,
# so the same rules apply wherever a file lives.
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "storage", ".next", "node_modules"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "B008",    # FastAPI's Depends()/File()/Form() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations add noise to Pydantic/SQLAlchemy models
    # This is a multilingual speech app: Armenian, Cyrillic and CJK literals in
    # source and tests are the subject matter, not a homoglyph attack.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"backend/tests/*" = ["E501"]

[lint.isort]
known-first-party = ["app", "ai"]

[format]
quote-style = "double"
