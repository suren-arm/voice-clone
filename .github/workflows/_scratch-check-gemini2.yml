name: Scratch check Gemini configured 2

on:
  workflow_dispatch:
    inputs:
      url:
        description: Backend base URL to check
        type: string
        default: https://voice-clone-2nhg.onrender.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GET /api/v1/ai/providers for gemini availability
        run: |
          url="${{ inputs.url }}/api/v1/ai/providers"
          status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -m 20 "$url" || echo "000")
          echo "GET $url -> HTTP $status"
          cat /tmp/body.json
          echo ""
          if [ "$status" != "200" ]; then
            echo "::error::Could not reach the providers endpoint"
            exit 1
          fi
          python3 - <<'PYEOF'
          import json
          data = json.load(open('/tmp/body.json'))
          gemini = next((p for p in data['providers'] if p['id'] == 'gemini'), None)
          print('gemini entry:', gemini)
          print('autoResolvesTo:', data.get('autoResolvesTo'))
          if not gemini or not gemini['available']:
              raise SystemExit('Gemini is not yet reported as available.')
          print('Gemini is configured and available.')
          PYEOF

      - name: End-to-end story generation via Gemini (English)
        run: |
          curl -sS -m 60 -X POST "${{ inputs.url }}/api/v1/stories/generate" \
            -H 'Content-Type: application/json' \
            -d '{"provider":"gemini","language":"en","characters":"A rabbit and a fox","idea":"they become unlikely friends in a meadow","ageGroup":"6-8","length":"short","tone":"magical"}' \
            -o /tmp/story.json -w '\nHTTP %{http_code}\n'
          cat /tmp/story.json
          python3 -c "
          import json
          data = json.load(open('/tmp/story.json'))
          assert 'text' in data and len(data['text']) > 20, data
          print('Story generated OK, provider:', data.get('provider'), '/', data.get('providerName'))
          print('word count:', data.get('wordCount'))
          "

      - name: End-to-end story generation via Gemini (Armenian)
        run: |
          curl -sS -m 60 -X POST "${{ inputs.url }}/api/v1/stories/generate" \
            -H 'Content-Type: application/json' \
            -d '{"provider":"gemini","language":"hy","characters":"Կարապետ և Ռուզաննա","idea":"adventure in a magical forest with giant animals","ageGroup":"6-8","length":"short","tone":"magical"}' \
            -o /tmp/story_hy.json -w '\nHTTP %{http_code}\n'
          cat /tmp/story_hy.json
          python3 -c "
          import json
          data = json.load(open('/tmp/story_hy.json'))
          assert 'text' in data and len(data['text']) > 20, data
          print('Armenian story generated OK, provider:', data.get('provider'))
          "
