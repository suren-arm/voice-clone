name: Scratch research

on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-keller-svtt3z]
    paths:
      - '.github/workflows/_scratch-research.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check Piper TTS voice catalog for Armenian
        run: |
          echo "=== Piper voices.json (rhasspy/piper-voices on HF) ==="
          curl -sSL "https://huggingface.co/rhasspy/piper-voices/raw/main/voices.json" -o /tmp/voices.json || echo "fetch failed"
          wc -c /tmp/voices.json || true
          echo "--- languages present (family codes) ---"
          python3 -c "
import json
try:
    data = json.load(open('/tmp/voices.json'))
    langs = sorted(set(v['language']['code'] for v in data.values()))
    print(langs)
    hy = [k for k,v in data.items() if v['language']['code'].startswith('hy')]
    print('Armenian entries:', hy)
except Exception as e:
    print('parse error', e)
" || true

      - name: Check facebook/mms-tts-hye license and files
        run: |
          echo "=== mms-tts-hye model card (raw README) ==="
          curl -sSL "https://huggingface.co/facebook/mms-tts-hye/raw/main/README.md" | head -40 || echo "fetch failed"

      - name: Check for any other Armenian open TTS on HF (search API)
        run: |
          curl -sSL "https://huggingface.co/api/models?search=armenian%20tts&limit=20" -o /tmp/search1.json || true
          python3 -c "
import json
try:
    data = json.load(open('/tmp/search1.json'))
    for m in data:
        print(m.get('id'), m.get('tags'))
except Exception as e:
    print('parse error', e)
" || true
          echo "--- search 'hy tts' ---"
          curl -sSL "https://huggingface.co/api/models?search=hy%20tts&limit=20" -o /tmp/search2.json || true
          python3 -c "
import json
try:
    data = json.load(open('/tmp/search2.json'))
    for m in data:
        print(m.get('id'), m.get('tags'))
except Exception as e:
    print('parse error', e)
" || true
