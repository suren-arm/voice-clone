name: AI integration tests

# Real model weights, downloaded for real. These are slow on CPU, so they
# never run on the ordinary pull-request path -- see ci.yml, which uses the
# mock engine instead. This workflow proves the actual Chatterbox integration
# clones a voice rather than emitting a fixed default; see
# backend/tests/ai/test_chatterbox_engine.py for what it checks.
#
# A `push` trigger is included, scoped to only the files that could affect
# this behaviour, for two reasons: it re-verifies the real model whenever the
# engine or its tests change, and -- a real GitHub Actions quirk -- a
# workflow with *only* `workflow_dispatch`/`schedule` triggers is not always
# registered for manual dispatch via the API/UI until a push event actually
# matches one of its trigger clauses. Do not remove this trigger without
# confirming manual dispatch still works.
on:
  push:
    branches: [master, main]
    paths:
      - 'ai/**'
      - 'backend/tests/ai/**'
      - '.github/workflows/ai-tests.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: Chatterbox variant to test
        type: choice
        options: [turbo, english, multilingual]
        default: turbo
  schedule:
    # Weekly, to catch upstream model or dependency drift.
    - cron: '0 4 * * 1'

jobs:
  ai:
    name: Real model
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 espeak-ng

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.variant || 'turbo' }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          pip install -r backend/requirements.txt pytest==9.0.2

      - name: Run AI tests
        working-directory: backend
        env:
          DEVICE: cpu
          CHATTERBOX_VARIANT: ${{ inputs.variant || 'turbo' }}
        run: pytest -m ai tests/ai -v
