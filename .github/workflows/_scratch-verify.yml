name: Scratch verify

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the alias domain for the correct backend URL
        run: |
          base="https://ai-voice-studio-660.pages.dev"
          curl -sS "$base/voices/new" -o /tmp/page.html
          grep -oE '/_next/static/[a-zA-Z0-9/_.-]+\.js' /tmp/page.html | sort -u > /tmp/chunks.txt
          found=0
          while read -r chunk; do
            curl -sS "$base$chunk" -o /tmp/chunk.js
            if grep -q 'https://voice-clone-2nhg\.onrender\.com' /tmp/chunk.js; then
              echo "FOUND correct URL in $chunk"
              found=1
            fi
            if grep -q 'https://voice-clone-api\.onrender\.com' /tmp/chunk.js; then
              echo "FOUND OLD placeholder URL in $chunk"
            fi
          done < /tmp/chunks.txt
          if [ "$found" = "1" ]; then
            echo "RESULT: alias domain is serving the correct build"
          else
            echo "RESULT: alias domain still stale"
            exit 1
          fi
