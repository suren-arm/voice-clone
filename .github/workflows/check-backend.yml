name: Check backend health

# On-demand health check for the deployed backend, dispatched from wherever
# this repo's CI/CD is managed. Exists because neither the coding sandbox
# that built this deployment nor its author can reach render.com directly
# (network policy blocks it, same as api.cloudflare.com) -- this runs on a
# GitHub Actions runner, which has normal internet access, so it can give a
# real answer instead of a guess.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Backend base URL to check
        type: string
        default: https://voice-clone.onrender.com
      timeout_seconds:
        description: Per-request timeout. Raise it if a cold start is suspected.
        type: string
        default: '240'

jobs:
  check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose reachability
        # Run before the health check so a failure below can be attributed.
        # "curl timed out" alone cannot tell apart DNS failure, a refused
        # connection, a TLS problem and an instance that accepts the
        # connection but never answers -- which are four different bugs with
        # four different fixes. This separates them.
        run: |
          host=$(echo "${{ inputs.url }}" | sed -E 's#^https?://##; s#/.*##')
          echo "::group::DNS"
          getent hosts "$host" || echo "DNS: no A/AAAA record for $host"
          echo "::endgroup::"

          echo "::group::TCP + TLS handshake (10s budget)"
          if curl -sS -o /dev/null -m 10 --connect-timeout 10 \
               -w 'dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s\n' \
               "https://$host/" 2>&1; then
            echo "Handshake completed and a response arrived within 10s."
          else
            echo "No response body within 10s. If dns/connect/tls above are all"
            echo "non-zero, the instance is accepting connections but not"
            echo "answering -- that points at the app, not the network."
          fi
          echo "::endgroup::"

      - name: Check /health
        # Render spins down on idle, and this image is large (torch), so a
        # cold start can run well past a minute. Give it real room rather
        # than reporting a slow wake as "unreachable".
        run: |
          url="${{ inputs.url }}/health"
          t="${{ inputs.timeout_seconds }}"
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' -m "$t" "$url" || echo "000")
          echo "GET $url -> HTTP $status (timeout ${t}s)"
          if [ "$status" = "000" ]; then
            echo "::error::Could not reach $url at all (DNS/connection failure or timeout after ${t}s)"
            exit 1
          fi
          echo "--- response body ---"
          cat /tmp/health.json || true
          echo ""
          if [ "$status" != "200" ]; then
            echo "::error::$url returned HTTP $status, not 200"
            exit 1
          fi

      - name: Check /api/v1/system/info
        run: |
          url="${{ inputs.url }}/api/v1/system/info"
          t="${{ inputs.timeout_seconds }}"
          status=$(curl -sS -o /tmp/info.json -w '%{http_code}' -m "$t" "$url" || echo "000")
          echo "GET $url -> HTTP $status"
          echo "--- response body ---"
          cat /tmp/info.json || true
          echo ""
