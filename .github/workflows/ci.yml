name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never touches a real model. The mock engine exercises every code path
  # the application owns, and downloading multi-gigabyte weights on every push
  # would make the pipeline slow, flaky and expensive.
  VOICE_ENGINE: mock

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install ffmpeg and espeak-ng
        # Must match backend/Dockerfile.render's system packages: espeak-ng
        # powers the built-in default voices, so without it the startup
        # bootstrap creates none and every default-voice test either skips
        # (tests/unit/test_espeak_engine.py) or fails looking one up
        # (tests/api/test_books_api.py). CI silently drifting from the
        # production image is how that goes unnoticed.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 espeak-ng

      - name: Install dependencies
        # requirements-ci.txt deliberately omits chatterbox-tts (and torch).
        run: pip install -r backend/requirements-ci.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov=../ai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # The suite stubs the API in the browser, so no backend is needed here.
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `load: true` (not the previous `false`) on every image below is
      # deliberate: a build that only pushes to the layer cache never gets
      # executed, so a container that builds fine but crashes on start --
      # e.g. importing a module that silently never made it into the git
      # tree, which is exactly what shipped past this job once already --
      # would still report success. Loading the image and actually starting
      # it is the only thing that catches that class of bug here.
      - name: Build backend image (CPU target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: cpu
          push: false
          load: true
          tags: voice-studio-api:cpu-ci
          cache-from: type=gha,scope=backend-cpu
          cache-to: type=gha,mode=max,scope=backend-cpu

      - name: Build backend image (Render target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.render
          push: false
          load: true
          tags: voice-studio-api:render-ci
          cache-from: type=gha,scope=backend-render
          cache-to: type=gha,mode=max,scope=backend-render

      - name: Smoke-test the backend images actually start and serve /health
        run: |
          set -euo pipefail
          for tag in voice-studio-api:cpu-ci voice-studio-api:render-ci; do
            echo "--- $tag ---"
            cid=$(docker run -d -p 8000:8000 -e VOICE_ENGINE=mock -e PORT=8000 "$tag")
            ok=false
            for _ in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health; then
                ok=true
                break
              fi
              sleep 1
            done
            docker logs "$cid"
            docker rm -f "$cid" >/dev/null
            if [ "$ok" != true ]; then
              echo "::error::$tag did not answer /health within 30s"
              exit 1
            fi
            echo
          done

      - name: Build frontend image (Docker/standalone target)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: voice-studio-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend-docker
          cache-to: type=gha,mode=max,scope=frontend-docker

      - name: Smoke-test the frontend image actually starts and serves /
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 3000:3000 voice-studio-web:ci)
          ok=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          docker logs "$cid"
          docker rm -f "$cid" >/dev/null
          if [ "$ok" != true ]; then
            echo "::error::frontend image did not answer / within 30s"
            exit 1
          fi

      - name: Build frontend static export (Cloudflare Pages target)
        working-directory: frontend
        run: |
          # Not a Docker build -- Cloudflare Pages builds this directly with
          # Node, no image involved (see render.yaml's sibling doc,
          # docs/DEPLOYMENT.md#cloudflare-pages--render-the-shipped-config).
          # Verified here anyway, since it is the other half of what actually
          # ships, and a static-export-only regression (e.g. reintroducing a
          # server-only feature next.config.ts can't export) would otherwise
          # only surface on a real Cloudflare deploy.
          npm ci
          CLOUDFLARE_BUILD=1 NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build
          test -f out/index.html
          test -f out/404.html
