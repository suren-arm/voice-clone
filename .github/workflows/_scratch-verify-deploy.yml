name: Scratch verify deploy

on:
  workflow_dispatch:
    inputs:
      url:
        description: Backend base URL to check
        type: string
        default: https://voice-clone-2nhg.onrender.com
      frontend_url:
        description: Frontend base URL to check
        type: string
        default: https://ai-voice-studio-660.pages.dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the new /voices/defaults endpoint to come up
        run: |
          url="${{ inputs.url }}/api/v1/voices/defaults"
          echo "Polling $url (Render Docker rebuild can take several minutes)..."
          for i in $(seq 1 40); do
            status=$(curl -sS -o /tmp/body.json -w '%{http_code}' -m 20 "$url" || echo "000")
            echo "attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "=== response ==="
              cat /tmp/body.json
              echo ""
              exit 0
            fi
            sleep 15
          done
          echo "::error::Endpoint never came up (still old backend, or deploy failed)"
          echo "--- last response body (if any) ---"
          cat /tmp/body.json 2>/dev/null || true
          exit 1

      - name: Also confirm existing system/info still works (no regression)
        if: always()
        run: |
          curl -sS -m 20 "${{ inputs.url }}/api/v1/system/info" | head -c 2000 || true

      - name: Confirm the Cloudflare production frontend serves the new /fairy-tale route
        if: always()
        run: |
          url="${{ inputs.frontend_url }}/fairy-tale"
          status=$(curl -sSL -o /tmp/fairytale.html -w '%{http_code}' -m 20 "$url" || echo "000")
          echo "GET $url -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::/fairy-tale did not return 200 on the production frontend"
            exit 1
          fi
          if grep -qi "Create Fairy Tale" /tmp/fairytale.html; then
            echo "Confirmed: production frontend serves the new Fairy Tale page."
          else
            echo "::error::/fairy-tale returned 200 but doesn't contain expected content"
            cat /tmp/fairytale.html
            exit 1
          fi
