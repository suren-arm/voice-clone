name: Deploy frontend to Cloudflare Pages

# Builds the Next.js app as a static export (frontend/next.config.ts,
# CLOUDFLARE_BUILD=1) and publishes it to Cloudflare Pages. This is the piece
# of the deployment that actually needs Cloudflare credentials, which this
# development environment does not have network access to use even if they
# were supplied here -- see docs/DEPLOYMENT.md for why this workflow exists
# instead of a deploy run from the coding session, and for the one-time setup
# below.
#
# One-time setup (required before this workflow can deploy anything):
#   1. Create a Cloudflare API token: My Profile -> API Tokens -> Create Token
#      -> "Edit Cloudflare Workers" template (grants Pages:Edit) is sufficient.
#   2. In this repo: Settings -> Secrets and variables -> Actions
#        Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#        Variables: NEXT_PUBLIC_API_URL   (the backend URL, e.g. from Render)
#                   CLOUDFLARE_PAGES_PROJECT  (optional; defaults below)
#   3. Push to main, or run this workflow manually (Actions tab -> this
#      workflow -> Run workflow).
#
# Until those secrets exist, every job below no-ops with a clear message
# instead of failing the build -- so this file is safe to merge before the
# Cloudflare side is set up.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # cloudflare/pages-action creates a GitHub Deployment record via the API
    # using GITHUB_TOKEN -- the default token this workflow gets is read-only
    # unless granted deployments:write here, and without it the publish step
    # fails with "Resource not accessible by integration" (403) after the
    # Cloudflare side has already succeeded.
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are configured
        id: preflight
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set as repository secrets. Skipping deploy -- see the comment at the top of this workflow file for one-time setup steps."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: steps.preflight.outputs.configured == 'true'

      - name: Build static export
        if: steps.preflight.outputs.configured == 'true'
        run: npm run build
        env:
          CLOUDFLARE_BUILD: '1'
          # The backend's public URL -- required for the deployed frontend to
          # reach the API at all. Set as an Actions *variable* (not secret;
          # it's not sensitive) once the backend is deployed. Falls back to a
          # placeholder so the build never fails outright, but a placeholder
          # deploy cannot talk to any real backend -- set this for real.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://voice-clone-api.onrender.com' }}

      - name: Ensure the Cloudflare Pages project exists
        # cloudflare/pages-action can only deploy to a project that already
        # exists -- it returns "Project not found" (8000007) rather than
        # creating one. Create it via the API on first run so this workflow
        # is a genuine one-shot: no separate manual "create the project in
        # the dashboard" step required before the first deploy succeeds.
        if: steps.preflight.outputs.configured == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ai-voice-studio' }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [ "$status" = "404" ]; then
            echo "Project '$CF_PROJECT' does not exist yet -- creating it."
            curl -sf -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$CF_PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          elif [ "$status" != "200" ]; then
            echo "::error::Unexpected response ($status) checking for project '$CF_PROJECT' -- see docs/DEPLOYMENT.md"
            exit 1
          else
            echo "Project '$CF_PROJECT' already exists."
          fi

      - name: Publish to Cloudflare Pages
        if: steps.preflight.outputs.configured == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ai-voice-studio' }}
          directory: frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
